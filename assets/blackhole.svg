<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated black hole banner">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c9a6ff"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd479"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bff"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dd6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8fe9ff"/>
      <stop offset="100%" stop-color="#3dd6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="35" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="90" r="1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="45" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="160" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="130" r="1" opacity="0.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="190" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="40" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="95" r="1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="50" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="165" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="135" r="1" opacity="0.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.3s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="195" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="25" r="1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="195" r="1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(600,110)">
    <ellipse rx="260" ry="58" fill="none" stroke="url(#ring1)" stroke-width="6" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="190" ry="42" fill="none" stroke="url(#ring2)" stroke-width="5" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="120" ry="26" fill="none" stroke="url(#ring3)" stroke-width="4" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7.5s" repeatCount="indefinite"/>
    </ellipse>

    <circle r="34" fill="#000000"/>
    <circle r="30" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="28;35;28" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#000000"/>
  </g>
</svg>
